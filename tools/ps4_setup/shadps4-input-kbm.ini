#Feeling lost? Check out the Help section!

# Pad config for the game's own PC keyboard layer (emulator D1_KBM=1, optionally D1_KBM_MAP).
# Copy over user/input_config/default.ini (keep the original), then press F8 in the emulator to reload.
# The letter, arrow, Space, Ins/End and PgUp/PgDn keys are left to the game itself: mapping them here
# too would make them act twice (once as a pad button, once through the game's key layer).
# Only keys the game's keyboard layer never reads stay mapped to pad buttons.

# Keyboard bindings

triangle = kp8
circle = kp6
cross = kp2
square = kp4

options = enter
touchpad_center = tab

# Controller bindings

triangle = triangle
cross = cross
square = square
circle = circle

l1 = l1
l2 = l2
l3 = l3
r1 = r1
r2 = r2
r3 = r3

options = options
touchpad_center = back

pad_up = pad_up
pad_down = pad_down
pad_left = pad_left
pad_right = pad_right

axis_left_x = axis_left_x
axis_left_y = axis_left_y
axis_right_x = axis_right_x
axis_right_y = axis_right_y

# Range of deadzones: 1 (almost none) to 127 (max)
analog_deadzone = leftjoystick, 5, 127
analog_deadzone = rightjoystick, 5, 127

override_controller_color = false, 0, 0, 255

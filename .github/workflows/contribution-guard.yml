# Blocks pull requests that add game files, firmware, keys or large binaries.
# A maintainer can add the "inputs-reviewed" label to accept a reviewed exception.
name: Contribution guard
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
jobs:
  inputs:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'inputs-reviewed') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Reject game files, keys and large binaries
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          status=0
          while IFS= read -r file; do
            name="${file,,}"; name="${name%.part[0-9]*}"
            case "$name" in
              *.pkg|*.elf|*.self|*.sprx|*.prx|*.sfo|*.edat|*.sdat|*.rap|*.rif|*.pup|*.iso|*.exe|*.dll|*.key|*.pem|*.p12|*.pfx)
                echo "::error file=$file::This file type can't be contributed: game files, firmware, binaries and keys stay out of the repository."
                status=1;;
            esac
            size=$(git cat-file -s "HEAD:$file" 2>/dev/null || echo 0)
            if [ "$size" -gt 5242880 ]; then
              echo "::error file=$file::Files over 5 MB need a maintainer's review (label: inputs-reviewed)."
              status=1
            fi
          done < <(git diff --name-only --diff-filter=A "$BASE"...HEAD)
          exit $status

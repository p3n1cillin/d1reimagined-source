# The checks main requires (ruleset "main: PRs with green CI"): the job names below are the required
# contexts, so rename them only together with the ruleset. Fork PRs run with a read-only token and no
# secrets. CI has no game files: tests that need them skip here and run on contributors' machines.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: |
          for dir in server scripts tests tools/content_capture; do
            echo "::group::$dir"
            python -m unittest discover -s "$dir" -p 'test_*.py'
            echo "::endgroup::"
          done

  # Keep the existing required Linux 'python' check context unchanged.
  python-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - name: Windows unit tests
        shell: pwsh
        run: |
          foreach ($dir in @('server', 'scripts', 'tests', 'tools/content_capture')) {
            Write-Host "::group::$dir"
            python -m unittest discover -s $dir -p 'test_*.py'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "::endgroup::"
          }

  rust-package-tools:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ps4/d1-server
    steps:
      - uses: actions/checkout@v7
      - name: Package and platform tests
        run: cargo test --locked -p d1-pkg --bin d1-byte-scan --bin d1-platform --bin d1-pkg-header-audit
      - name: Scanner and platform controls
        run: |
          cargo run --locked -p d1-pkg --bin d1-byte-scan -- controls
          cargo run --locked -p d1-pkg --bin d1-platform -- controls
      - name: Synthetic tracer and gate tests
        run: cargo test --locked --manifest-path ../d1-trace/Cargo.toml --no-default-features

  # Left out: d1-activity-host (needs private game inputs), d1-pkg (covered above),
  # and d1-live live-process tests (a fixture process and ptrace debug registers).
  rust-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ps4/d1-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ps4/d1-server/target
          key: rust-workspace-${{ hashFiles('ps4/d1-server/Cargo.lock') }}
          restore-keys: rust-workspace-
      - name: Native build dependencies for shadnet-proto and d1-oracle
        run: sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler libclang-dev ninja-build
      - name: Workspace tests
        run: >-
          cargo test --locked --no-fail-fast --workspace
          --exclude d1-activity-host --exclude d1-pkg --exclude d1-live
      - name: Explain d1-oracle tests skipped without private inputs
        run: cargo test --locked -p d1-oracle -- --show-output
      - name: d1-live library tests
        run: cargo test --locked -p d1-live --lib

  # No game files, firmware, keys or large binaries. After reviewing an exception, a maintainer labels
  # the PR "inputs-reviewed" and re-runs this job.
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'inputs-reviewed')
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'inputs-reviewed')
        name: Reject game files, keys and large binaries
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          status=0
          while IFS= read -r file; do
            name="${file,,}"; name="${name%.part[0-9]*}"
            case "$name" in
              *.pkg|*.elf|*.self|*.sprx|*.prx|*.sfo|*.edat|*.sdat|*.rap|*.rif|*.pup|*.iso|*.exe|*.dll|*.key|*.pem|*.p12|*.pfx)
                echo "::error file=$file::This file type can't be contributed: game files, firmware, binaries and keys stay out of the repository."
                status=1;;
            esac
            size=$(git cat-file -s "HEAD:$file" 2>/dev/null || echo 0)
            if [ "$size" -gt 5242880 ]; then
              echo "::error file=$file::Files over 5 MB need a maintainer's review (label: inputs-reviewed)."
              status=1
            fi
          done < <(git diff --name-only --diff-filter=A "$BASE"...HEAD)
          exit $status

  # Lint findings on the lines a pull request adds, as inline warnings (.github/scripts/new_findings.py).
  # Not a required check: existing code has warnings of its own, and these are review hints.
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Changed files
        id: files
        run: |
          echo "py=$(git diff --name-only --diff-filter=AM "$BASE"...HEAD -- '*.py' | paste -sd ' ')" >> "$GITHUB_OUTPUT"
          echo "rs=$(git diff --name-only --diff-filter=AM "$BASE"...HEAD -- 'ps4/d1-server/*.rs' | paste -sd ' ')" >> "$GITHUB_OUTPUT"
      - name: Python (ruff)
        if: steps.files.outputs.py != ''
        env:
          FILES: ${{ steps.files.outputs.py }}
        run: |
          python3 -m pip install -q ruff
          read -ra changed <<< "$FILES"
          # Syntax errors, undefined names, unused imports and variables, redefinitions.
          ruff check --no-cache --output-format=concise --select E9,F63,F7,F82,F401,F811,F841 "${changed[@]}" |
            python3 .github/scripts/new_findings.py --base "$BASE" --tool ruff || true
      - name: Rust formatting (rustfmt)
        if: steps.files.outputs.rs != ''
        env:
          FILES: ${{ steps.files.outputs.rs }}
        run: |
          read -ra changed <<< "$FILES"
          rustfmt --check --edition 2021 "${changed[@]}" 2>&1 | python3 .github/scripts/new_findings.py --base "$BASE" --tool rustfmt || true
      - uses: actions/cache@v4
        if: steps.files.outputs.rs != ''
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ps4/d1-server/target
          key: lint-${{ hashFiles('ps4/d1-server/Cargo.lock') }}
          restore-keys: |
            lint-
            rust-workspace-
      - name: protoc for shadnet-proto
        if: steps.files.outputs.rs != ''
        run: sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler
      - name: Rust lints (clippy)
        if: steps.files.outputs.rs != ''
        working-directory: ps4/d1-server
        run: |
          cargo clippy --locked --workspace --exclude d1-oracle --exclude d1-activity-host --all-targets \
            --message-format=short 2>&1 |
            python3 ../../.github/scripts/new_findings.py --base "$BASE" --tool clippy --prefix ps4/d1-server || true

  # Lints the workflows themselves (expressions, permissions, shell). Not a required check.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

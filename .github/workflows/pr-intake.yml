# Intake for new pull requests (ported from AnyPS5):
# - the open-PR limit: 1 open PR until an author has one merged, 20 after that, none from 20 merged;
# - "needs review" on every PR that isn't the maintainer's or a bot's, so it enters the review queue.
# pull_request_target runs from main and never checks out or executes pull request code.
name: PR intake

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, ready_for_review]

permissions: {}

concurrency:
  group: pr-intake-${{ github.event.pull_request.number }}

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            if (pr.state !== 'open' || pr.base.ref !== 'main') return;
            const author = pr.user.login;
            if (author === owner || author.endsWith('[bot]')) return;

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({ owner, repo, name, color, description });
                } catch (createError) {
                  if (createError.status !== 422) throw createError;
                }
              }
            }

            const { data: mergedPRs } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:pr is:merged base:main author:${author}`, per_page: 1
            });
            if (mergedPRs.incomplete_results || !Number.isSafeInteger(mergedPRs.total_count)) {
              throw new Error('Could not reliably count merged pull requests');
            }
            const merged = mergedPRs.total_count;
            if (merged < 20) {
              const allowedOpen = merged >= 1 ? 20 : 1;
              const openPRs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', base: 'main', per_page: 100 });
              const open = new Set(openPRs.filter((p) => p.user.login === author).map((p) => p.number));
              open.add(pull_number);
              if (open.size > allowedOpen) {
                const name = 'open PR limit';
                await ensureLabel(name, 'd93f0b', 'Closed over the open PR limit: 1 without merged PRs, 20 with at least 1, none from 20');
                await github.rest.issues.addLabels({ owner, repo, issue_number: pull_number, labels: [name] });
                const body = 'Thank you for your contribution! Authors with no pull requests merged into `main` can have 1 open pull request at a time, authors with at least 1 merged can have 20, and from 20 merged there is no limit. This PR has been closed automatically and labelled "open PR limit" because that limit was reached. It is not a judgement of the change: reopen it once one of your open pull requests is merged or closed.';
                const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pull_number, per_page: 100 });
                if (!comments.some((c) => c.user.login === 'github-actions[bot]' && c.body === body)) {
                  await github.rest.issues.createComment({ owner, repo, issue_number: pull_number, body });
                }
                await github.rest.pulls.update({ owner, repo, pull_number, state: 'closed' });
                return;
              }
            }
            if (!pr.draft) {
              await ensureLabel('needs review', 'fbca04', 'Waiting for a maintainer review');
              await github.rest.issues.addLabels({ owner, repo, issue_number: pull_number, labels: ['needs review'] });
            }

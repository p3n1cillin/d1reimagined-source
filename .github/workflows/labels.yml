# Keeps the repository's labels in step with the automation that uses them.
name: Labels

on:
  push:
    branches: [main]
    paths: ['.github/workflows/labels.yml']
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          label() { gh label create "$1" --color "$2" --description "$3" --force; }
          # Review state (merge-sweep.yml, pr-intake.yml)
          label 'needs review'      fbca04 'Waiting for a maintainer review'
          label 'approved'          0e8a16 'Approved by a maintainer; merges when the checks pass'
          label 'changes requested' d93f0b 'A maintainer asked for changes'
          label 'maintainer merge'  5319e7 'Touches repository automation, so a maintainer merges it by hand'
          label 'do not merge'      b60205 'Hold: never auto-merged'
          # Housekeeping
          label 'needs rebase'      b60205 'Conflicts with main, rebase needed'
          label 'open PR limit'     d93f0b 'Closed over the open PR limit: 1 without merged PRs, 20 with at least 1, none from 20'
          label 'stale'             ededed 'No activity for 30 days'
          label 'inputs-reviewed'   c5def5 'A maintainer accepted a large or unusual file (contribution guard)'
          label 'dependencies'      0366d6 'Dependency updates'
          label 'good first issue'  7057ff 'A small, well-scoped place to start'
          # Size (pr-size.yml): changed lines
          label 'size/XS' 3cbf00 'Up to 10 changed lines'
          label 'size/S'  5d9801 'Up to 100 changed lines'
          label 'size/M'  7f7203 'Up to 500 changed lines'
          label 'size/L'  a14c05 'Up to 1000 changed lines'
          label 'size/XL' b60205 'Over 1000 changed lines: consider splitting it'
          # Areas (area-labels.yml, .github/labeler.yml)
          label 'server'    1d76db 'ps4/d1-server'
          label 'trace'     1d76db 'ps4/d1-trace, d1-observe, capture-rig'
          label 'research'  c5def5 'ghidra, design, notes'
          label 'missions'  0e8a16 'missions, loadouts'
          label 'ps3'       bfd4f2 'Retained PS3 server, patches, data'
          label 'tools'     fbca04 'tools, scripts'
          label 'docs'      0075ca 'Documentation'
          label 'ci'        5319e7 '.github'
          label 'tests'     d4c5f9 'Tests only'

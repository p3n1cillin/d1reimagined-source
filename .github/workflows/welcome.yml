# Welcomes someone's first issue or pull request in this repository.
name: Welcome
on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]
permissions:
  issues: write
  pull-requests: write
jobs:
  welcome:
    if: ${{ !endsWith(github.actor, '[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const item = context.payload.issue || context.payload.pull_request;
            const {owner, repo} = context.repo;
            if (item.user.login === owner) return;
            const found = await github.rest.search.issuesAndPullRequests({q: `repo:${owner}/${repo} author:${item.user.login}`, per_page: 2});
            if (found.data.total_count > 1) return;
            const kind = context.payload.issue ? 'issue' : 'pull request';
            const body = [
              `Thanks for your first ${kind}, @${item.user.login}, and welcome to D1 Reimagined.`,
              '',
              'A maintainer will take a look. Meanwhile:',
              '- [Contributing guide](https://github.com/p3n1cillin/d1reimagined-source/blob/main/CONTRIBUTING.md) and [contributor checkpoint](https://github.com/p3n1cillin/d1reimagined-source/blob/main/docs/STATUS.md)',
              '- Questions and early ideas: the [community Discord](https://d1reimagined.com/discord) (help and ideas forums)',
              '- Progress: the [Dev Blogs](https://d1reimagined.com/devblogs)',
              '',
              'Please keep game files, keys, firmware and account data out of issues and pull requests.'
            ].join('\n');
            await github.rest.issues.createComment({owner, repo, issue_number: item.number, body});

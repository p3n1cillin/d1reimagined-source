name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s server -p 'test_*.py'
      - run: python -m unittest discover -s scripts -p 'test_*.py'
  rust-package-tools:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Package and platform tests without game inputs
        working-directory: ps4/d1-server
        run: cargo test --locked -p d1-pkg --bin d1-byte-scan --bin d1-platform --bin d1-pkg-header-audit
      - name: Scanner controls
        working-directory: ps4/d1-server
        run: cargo run --locked -p d1-pkg --bin d1-byte-scan -- controls
      - name: Platform controls
        working-directory: ps4/d1-server
        run: cargo run --locked -p d1-pkg --bin d1-platform -- controls
      - name: Synthetic tracer and gate tests
        run: cargo test --locked --manifest-path ps4/d1-trace/Cargo.toml --no-default-features
  # The server workspace's tests. Tests that need private inputs (the game executable, the guest symbol
  # file) skip themselves when the input is absent, as here, and run on contributors' machines; see
  # CONTRIBUTING.md. Left out on CI: d1-oracle and d1-activity-host (they need the executable to build
  # their controls, and bindgen), d1-pkg (its input-free tests run above), and d1-live's live-process
  # tests (readside spawns a fixture this run doesn't build; watchpoint needs CPU debug registers
  # through ptrace, which the runner's VM doesn't give).
  rust-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ps4/d1-server/target
          key: rust-workspace-${{ hashFiles('ps4/d1-server/Cargo.lock') }}
          restore-keys: rust-workspace-
      - name: protoc for shadnet-proto
        run: sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler
      - name: Workspace tests without game inputs
        working-directory: ps4/d1-server
        run: >-
          cargo test --locked --no-fail-fast --workspace
          --exclude d1-oracle --exclude d1-activity-host --exclude d1-pkg --exclude d1-live
      - name: d1-live library tests (its live-process tests need a debugger-capable host)
        working-directory: ps4/d1-server
        run: cargo test --locked -p d1-live --lib

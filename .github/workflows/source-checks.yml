name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s server -p 'test_*.py'
      - run: python -m unittest discover -s scripts -p 'test_*.py'
  rust-package-tools:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Package and platform tests without game inputs
        working-directory: ps4/d1-server
        run: cargo test --locked -p d1-pkg --bin d1-byte-scan --bin d1-platform --bin d1-pkg-header-audit
      - name: Scanner controls
        working-directory: ps4/d1-server
        run: cargo run --locked -p d1-pkg --bin d1-byte-scan -- controls
      - name: Platform controls
        working-directory: ps4/d1-server
        run: cargo run --locked -p d1-pkg --bin d1-platform -- controls
      - name: Synthetic tracer and gate tests
        run: cargo test --locked --manifest-path ps4/d1-trace/Cargo.toml --no-default-features
  # Every server crate's tests that need no game inputs. d1-oracle and d1-activity-host need the game
  # executable (and bindgen); d1-pkg's input-free tests run above.
  rust-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ps4/d1-server/target
          key: rust-workspace-${{ hashFiles('ps4/d1-server/Cargo.lock') }}
          restore-keys: rust-workspace-
      - name: protoc for shadnet-proto
        run: sudo apt-get update -q && sudo apt-get install -y -q protobuf-compiler
      - name: Workspace tests without game inputs
        working-directory: ps4/d1-server
        run: cargo test --locked --workspace --exclude d1-oracle --exclude d1-activity-host --exclude d1-pkg

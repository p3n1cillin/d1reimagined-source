          label 'research'  c5def5 'ghidra, design, notes'
          label 'missions'  0e8a16 'missions, loadouts'
          label 'ps3'       bfd4f2 'Retained PS3 server, patches, data'
          label 'tools'     fbca04 'tools, scripts'
          label 'docs'      0075ca 'Documentation'
          label 'ci'        5319e7 '.github'
          label 'tests'     d4c5f9 'Tests only'
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-label: stale
          exempt-pr-labels: 'approved,do not merge,maintainer merge,dependencies'
          stale-pr-message: >-
            This pull request has had no activity for 30 days. If you're still working on it, push a commit or
            leave a comment and it stays open; otherwise it closes in 14 days. You can always reopen it later.
          close-pr-message: >-
            Closed after 44 days without activity. Thanks for the work so far: reopen it whenever you pick it up again.

  release:
    if: github.event.schedule == '30 17 * * 0' || inputs.release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: sweep-release
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          last=$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName // empty')
          if [ -n "$last" ]; then
            since=$(gh release view "$last" --json createdAt --jq .createdAt)
          else
            since=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          fi
          merged=$(gh pr list --state merged --search "merged:>$since -author:app/dependabot" --json number --jq length)
          if [ "$merged" -eq 0 ]; then
            echo "Nothing merged since $since; no release this week."
            exit 0
          fi
          tag="weekly-$(date -u +%Y-%m-%d)"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag already exists."
            exit 0
          fi
          gh release create "$tag" --target "${{ github.event.repository.default_branch }}" \
            --title "Weekly progress — $(date -u '+%-d %B %Y')" \
            --generate-notes ${last:+--notes-start-tag "$last"}

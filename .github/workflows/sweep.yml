# Scheduled upkeep, run from main. It reads PR metadata and git objects only, never PR code.
# - every 15 min, merge: contributors' PRs follow the maintainer's review. APPROVED on the current head
#   enables squash auto-merge (GitHub merges once main's required checks pass), unless the PR touches
#   .github/ ("maintainer merge": merged by hand) or carries "do not merge". New commits after an approval
#   go back to "needs review". It also labels check health: "awaiting CI approval", "checks failing"
#   (one comment per head commit) and "update branch" (behind main and missing a newer required check).
# - hourly and on pushes to main: "needs rebase" on conflicting PRs, and a comment on PRs that touch the
#   same lines as another open PR (.github/scripts/pr_overlap.py).
# - daily: the label set below; a "stale" reminder after 30 days without activity (never closed).
# - Sundays: a "Weekly progress" release with notes from the PRs merged since the last one.
name: Sweep

on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '45 * * * *'
    - cron: '20 4 * * *'
    - cron: '30 17 * * 0'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Publish the weekly release now
        type: boolean
        default: false

permissions: {}

jobs:
  merge:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: sweep-merge
    permissions:
      actions: read
      checks: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const maintainer = context.repo.owner;
            const STATES = ['needs review', 'approved', 'changes requested', 'maintainer merge'];
            async function setState(pr, state, extra = []) {
              const have = new Set(pr.labels.map((l) => l.name));
              for (const name of STATES) {
                if (name !== state && !extra.includes(name) && have.has(name)) {
                  await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name }).catch((e) => { if (e.status !== 404) throw e; });
                }
              }
              const add = [state, ...extra].filter((n) => n && !have.has(n));
              if (add.length) await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: add });
            }

            // Check health: which of main's required checks ran on the head, which failed, whether the
            // runs wait for approval (first-time contributors), and whether the branch predates a check.
            const rules = (await github.request('GET /repos/{owner}/{repo}/rules/branches/{branch}', { owner, repo, branch: 'main' })).data;
            const required = rules.filter((r) => r.type === 'required_status_checks')
              .flatMap((r) => r.parameters.required_status_checks.map((c) => c.context));
            async function toggle(pr, name, on) {
              const has = pr.labels.some((l) => l.name === name);
              if (on && !has) await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [name] });
              if (!on && has) await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name }).catch((e) => { if (e.status !== 404) throw e; });
            }
            async function commentOnce(pr, marker, body) {
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 });
              if (!comments.some((c) => c.user.login === 'github-actions[bot]' && c.body.includes(marker))) {
                await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: `${marker}\n${body}` });
              }
            }
            async function health(pr) {
              const runs = await github.paginate(github.rest.checks.listForRef, { owner, repo, ref: pr.head.sha, per_page: 100 });
              const latest = new Map();
              for (const run of runs) {
                const prev = latest.get(run.name);
                if (!prev || new Date(run.started_at) > new Date(prev.started_at)) latest.set(run.name, run);
              }
              const held = (await github.rest.actions.listWorkflowRunsForRepo({ owner, repo, head_sha: pr.head.sha, status: 'action_required', per_page: 20 })).data.total_count > 0;
              await toggle(pr, 'awaiting CI approval', held);
              const missing = required.filter((c) => !latest.has(c));
              const failing = required.filter((c) => latest.has(c) && latest.get(c).status === 'completed'
                && !['success', 'skipped', 'neutral'].includes(latest.get(c).conclusion));
              let behind = false;
              if (missing.length && !held) {
                const cmp = await github.rest.repos.compareCommitsWithBasehead({ owner, repo, basehead: `main...${pr.head.label}` }).catch(() => null);
                behind = !!cmp && cmp.data.behind_by > 0;
              }
              await toggle(pr, 'update branch', behind);
              if (behind) {
                await commentOnce(pr, `<!-- sweep:update-branch:${pr.head.sha} -->`,
                  `Thanks @${pr.user.login}! \`main\` now requires checks that haven't run on this branch yet (${missing.map((c) => '`' + c + '`').join(', ')}). ` +
                  'Please rebase onto the current `main` (or merge `main` into your branch) and push, so they run on your change.');
              }
              await toggle(pr, 'checks failing', failing.length > 0);
              if (failing.length) {
                await commentOnce(pr, `<!-- sweep:checks-failing:${pr.head.sha} -->`,
                  `Some required checks failed on ${pr.head.sha.slice(0, 7)}: ${failing.map((c) => `[\`${c}\`](${latest.get(c).html_url})`).join(', ')}. ` +
                  'Open the check for the log; push a fix and the checks run again.');
              }
            }

            const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', base: 'main', per_page: 100 });
            for (const pr of prs) {
              const author = pr.user.login;
              if (pr.draft || author === maintainer || author.endsWith('[bot]')) continue;
              const labels = new Set(pr.labels.map((l) => l.name));
              if (labels.has('open PR limit')) continue;
              try { await health(pr); } catch (error) { core.warning(`#${pr.number}: health check: ${error.message}`); }
              const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: pr.number, per_page: 100 });
              const verdicts = reviews.filter((r) => r.user && r.user.login === maintainer && ['APPROVED', 'CHANGES_REQUESTED'].includes(r.state));
              const last = verdicts[verdicts.length - 1];
              if (!last) { await setState(pr, 'needs review'); continue; }
              if (last.state === 'CHANGES_REQUESTED') {
                await setState(pr, last.commit_id === pr.head.sha ? 'changes requested' : 'needs review');
                continue;
              }
              if (last.commit_id !== pr.head.sha) { await setState(pr, 'needs review'); continue; }
              const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number, per_page: 100 });
              if (labels.has('do not merge')) { await setState(pr, 'approved'); continue; }
              if (files.some((f) => f.filename.startsWith('.github/'))) { await setState(pr, 'approved', ['maintainer merge']); continue; }
              await setState(pr, 'approved');
              if (pr.auto_merge) continue;
              // GitHub only accepts auto-merge while a PR is still waiting on checks; one that is already green
              // ("clean") is merged directly.
              const { data: fresh } = await github.rest.pulls.get({ owner, repo, pull_number: pr.number });
              try {
                if (fresh.mergeable_state === 'clean') {
                  await github.rest.pulls.merge({ owner, repo, pull_number: pr.number, sha: pr.head.sha, merge_method: 'squash', commit_title: `${pr.title} (#${pr.number})` });
                  core.info(`#${pr.number}: merged`);
                } else {
                  await github.graphql('mutation($id:ID!){enablePullRequestAutoMerge(input:{pullRequestId:$id,mergeMethod:SQUASH}){clientMutationId}}', { id: pr.node_id });
                  core.info(`#${pr.number}: auto-merge enabled`);
                }
              } catch (error) {
                core.warning(`#${pr.number}: could not merge or enable auto-merge: ${error.message}`);
              }
            }

  conflicts:
    if: github.event_name != 'schedule' || github.event.schedule == '45 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: sweep-conflicts
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: eps1lon/actions-label-merge-conflict@v3
        with:
          dirtyLabel: needs rebase
          repoToken: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Overlapping pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          out=$RUNNER_TEMP/overlap
          python3 -I .github/scripts/pr_overlap.py --base "${{ github.event.repository.default_branch }}" --out "$out" --repo "$GH_REPO"
          marker='<!-- pr-overlap -->'
          for file in "$out"/*.md; do
            [ -e "$file" ] || continue
            pr=$(basename "$file" .md)
            comment=$(gh api "repos/$GH_REPO/issues/$pr/comments" --paginate \
              --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | [.id, .body] | @json" | head -n1)
            id=$(jq -r '.[0] // empty' <<< "${comment:-null}")
            if [ -s "$file" ]; then
              [ "$(jq -r '.[1]' <<< "${comment:-null}")" = "$(cat "$file")" ] && continue
              if [ -n "$id" ]; then
                gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -F body=@"$file" > /dev/null
              else
                gh pr comment "$pr" --body-file "$file"
              fi
            elif [ -n "$id" ]; then
              gh api -X DELETE "repos/$GH_REPO/issues/comments/$id"
            fi
          done

  daily:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '20 4 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Labels
        run: |
          label() { gh label create "$1" --color "$2" --description "$3" --force > /dev/null; }
          # Review state (merge)
          label 'needs review'         fbca04 'Waiting for a maintainer review'
          label 'approved'             0e8a16 'Approved by a maintainer; merges when the checks pass'
          label 'changes requested'    d93f0b 'A maintainer asked for changes'
          label 'maintainer merge'     5319e7 'Touches repository automation, so a maintainer merges it by hand'
          label 'do not merge'         b60205 'Hold: never auto-merged'
          # Check health (merge)
          label 'awaiting CI approval' c5def5 "A maintainer still has to approve this first-time contributor's CI runs"
          label 'checks failing'       d93f0b 'A required check failed'
          label 'update branch'        fbca04 "Behind main and missing some of main's required checks: merge or rebase main"
          # Housekeeping
          label 'needs rebase'         b60205 'Conflicts with main, rebase needed'
          label 'open PR limit'        d93f0b 'Closed over the open PR limit: 1 without merged PRs, 20 with at least 1, none from 20'
          label 'stale'                ededed 'No activity for 30 days'
          label 'inputs-reviewed'      c5def5 'A maintainer accepted a large or unusual file (CI inputs check)'
          label 'dependencies'         0366d6 'Dependency updates'
          # Issues (templates and the README's links)
          label 'good first issue'     7057ff 'A small, well-scoped place to start'
          label 'help wanted'          008672 'Open for anyone to pick up'
          label 'bug'                  d73a4a 'Something fails to build, run or pass its checks'
          label 'investigation'        c5def5 'Research, a protocol investigation or an experiment'
          # Size (triage): changed lines
          label 'size/XS' 3cbf00 'Up to 10 changed lines'
          label 'size/S'  5d9801 'Up to 100 changed lines'
          label 'size/M'  7f7203 'Up to 500 changed lines'
          label 'size/L'  a14c05 'Up to 1000 changed lines'
          label 'size/XL' b60205 'Over 1000 changed lines: consider splitting it'
          # Areas (triage, .github/labeler.yml)
          label 'server'    1d76db 'ps4/d1-server'
          label 'trace'     1d76db 'ps4/d1-trace, d1-observe, capture-rig'
          label 'research'  c5def5 'ghidra, design, notes'
          label 'missions'  0e8a16 'missions, loadouts'
          label 'ps3'       bfd4f2 'Retained PS3 server, patches, data'
          label 'tools'     fbca04 'tools, scripts'
          label 'docs'      0075ca 'Documentation'
          label 'ci'        5319e7 '.github'
          label 'tests'     d4c5f9 'Tests only'
      # A reminder only: research PRs often wait on a lab run or on someone with the inputs, and closing
      # them loses work. Drafts are left alone.
      - uses: actions/stale@v9
        with:
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: 30
          days-before-pr-close: -1
          exempt-draft-pr: true
          remove-pr-stale-when-updated: true
          stale-pr-label: stale
          exempt-pr-labels: 'approved,do not merge,maintainer merge,dependencies'
          stale-pr-message: >-
            This pull request has had no activity for 30 days. If it's waiting on something (a review, a run,
            inputs), say what in a comment; if it conflicts with `main`, press Update branch or rebase.
            It won't be closed automatically.

  release:
        description: Publish the weekly release now
        type: boolean
        default: false

